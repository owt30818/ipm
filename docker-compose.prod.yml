services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipam-app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=http://${SERVER_IP:-localhost}:8000
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
    restart: unless-stopped
    depends_on:
      - supabase-kong
    networks:
      - ipam-network

  # Supabase Stack (Simplified for self-hosting)
  # 1. Postgres
  db:
    image: supabase/postgres:15.1.0.147
    container_name: ipam-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ./supabase/migrations:/docker-entrypoint-initdb.d
      - db-data:/var/lib/postgresql/data
    networks:
      - ipam-network

  # 2. GoTrue (Auth)
  supabase-auth:
    image: supabase/gotrue:v2.132.3
    container_name: ipam-auth
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://${SERVER_IP:-localhost}:3000
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
    depends_on:
      - db
    networks:
      - ipam-network

  # 3. PostgREST (API)
  supabase-rest:
    image: postgrest/postgrest:v11.2.0
    container_name: ipam-rest
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUC_CH: "false"
    depends_on:
      - db
    networks:
      - ipam-network

  # 4. Kong (Gateway)
  supabase-kong:
    image: kong:2.8.1
    container_name: ipam-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
    ports:
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ./supabase/config/kong.yml:/var/lib/kong/kong.yml
    networks:
      - ipam-network

networks:
  ipam-network:
    driver: bridge

volumes:
  db-data:
